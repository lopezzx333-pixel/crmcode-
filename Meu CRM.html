<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu CRM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111;--mut:#6b7280;--line:#e5e7eb;--late:#e5484d;--today:#d98a00}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1b1d22;--ink:#f3f4f6;--mut:#9aa1ad;--line:#2a2d34}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.danger{color:var(--late)}
.btn.wa{background:#c9f2d9;border-color:#c9f2d9;color:#0b3d1e;font-weight:600}
:focus-visible{outline:2px solid #6c8cff;outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{border:0;text-align:left;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--s,var(--card));color:#111;border:2px solid transparent}
.stat.on{border-color:#111}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:13px}
.money{background:#111;color:#fff;cursor:default}
@media (prefers-color-scheme:dark){.money{background:#fff;color:#111}.stat.on{border-color:#fff}}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.bar input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--s);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.late{border-color:var(--late);border-left-color:var(--late);box-shadow:0 0 0 1px var(--late)}
.card.today{border-color:var(--today);border-left-color:var(--today);box-shadow:0 0 0 1px var(--today)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.top h3{margin:0;font-size:17px;word-break:break-word}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--s);color:#111;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
.ret{font-size:13px;font-weight:600}
.late .ret{color:var(--late)}.today .ret{color:var(--today)}
.obs{font-size:13px;white-space:pre-wrap;max-height:4.4em;overflow:hidden}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.acts .btn{padding:6px 10px;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px;border:1px dashed var(--line);border-radius:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form h2{grid-column:1/-1;margin:0;font-size:18px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
label.full{grid-column:1/-1}
label input,label select,label textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
textarea{min-height:90px;resize:vertical}
.foot{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media(max-width:520px){form{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meu CRM</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exp">Exportar backup</button>
      <button class="btn" id="imp">Importar</button>
      <input type="file" id="file" accept=".json" hidden>
      <button class="btn pri" id="novo">+ Novo cliente</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Resumo"></section>

  <div class="bar">
    <input type="search" id="q" placeholder="Buscar por negócio, contato ou segmento">
    <select id="fs" aria-label="Filtrar por status"></select>
  </div>

  <main class="grid" id="list"></main>
</div>

<dialog id="dlg">
  <form id="f" method="dialog">
    <h2 id="ft">Novo cliente</h2>
    <label class="full">Nome do negócio *<input name="negocio" required></label>
    <label>Nome do contato<input name="contato"></label>
    <label>Telefone / WhatsApp<input name="tel" inputmode="tel" placeholder="(38) 99999-9999"></label>
    <label>E-mail<input name="email" type="email"></label>
    <label>Instagram ou site atual<input name="web"></label>
    <label>Segmento<input name="segmento" placeholder="Ex.: hamburgueria"></label>
    <label>Cidade<input name="cidade"></label>
    <label>Status<select name="status" id="st"></select></label>
    <label>Valor do projeto (R$)<input name="valor" type="number" min="0" step="0.01"></label>
    <label>Próximo retorno<input name="retorno" type="date"></label>
    <label class="full">Observações<textarea name="obs"></textarea></label>
    <div class="foot">
      <button type="button" class="btn" id="cancel">Cancelar</button>
      <button type="submit" class="btn pri">Salvar</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const KEY='crm_clientes_v1';
const STATUS=[
 ['Novo','#d9e4ff'],['Mensagem enviada','#e6dcff'],['Respondeu','#ffe9b8'],
 ['Proposta enviada','#ffd9e6'],['Fechado','#c9f2d9'],['Perdido','#e3e5e9']
];
const cor=Object.fromEntries(STATUS);
let clientes=[],editId=null,filtro='';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdata=s=>s?s.split('-').reverse().join('/'):'';

function carregar(){try{clientes=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){clientes=[]}}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(clientes))}catch(e){toast('Não foi possível salvar neste navegador. Use “Exportar backup”.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

function wa(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.length<=11)d='55'+d.replace(/^0+/,'');
  return 'https://wa.me/'+d;
}

function situacao(c){
  if(!c.retorno||c.status==='Fechado'||c.status==='Perdido')return '';
  const h=hoje();
  return c.retorno<h?'late':c.retorno===h?'today':'';
}

function renderStats(){
  const cont=Object.fromEntries(STATUS.map(([n])=>[n,0]));
  clientes.forEach(c=>cont[c.status]++);
  const total=clientes.filter(c=>c.status==='Fechado').reduce((s,c)=>s+(+c.valor||0),0);
  $('#stats').innerHTML=
    STATUS.map(([n,k])=>`<button class="stat ${filtro===n?'on':''}" style="--s:${k}" data-s="${esc(n)}"><b>${cont[n]}</b><span>${n}</span></button>`).join('')+
    `<div class="stat money"><b>${brl(total)}</b><span>Total fechado</span></div>`;
  $('#stats').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    filtro=filtro===b.dataset.s?'':b.dataset.s;$('#fs').value=filtro;render();
  });
}

function render(){
  renderStats();
  const q=$('#q').value.trim().toLowerCase();
  const lista=clientes.filter(c=>
    (!filtro||c.status===filtro)&&
    (!q||[c.negocio,c.contato,c.segmento].some(v=>(v||'').toLowerCase().includes(q)))
  ).sort((a,b)=>{
    const sa=situacao(a),sb=situacao(b),o={late:0,today:1,'':2};
    if(o[sa]!==o[sb])return o[sa]-o[sb];
    return (a.retorno||'9999').localeCompare(b.retorno||'9999');
  });
  if(!lista.length){
    $('#list').innerHTML=`<div class="empty">${clientes.length?'Nenhum cliente encontrado com esses filtros.':'Nenhum cliente ainda. Clique em "+ Novo cliente" para começar.'}</div>`;
    return;
  }
  $('#list').innerHTML=lista.map(c=>{
    const s=situacao(c),link=wa(c.tel);
    const rotulo=s==='late'?'Retorno vencido: ':s==='today'?'Retornar hoje: ':'Retorno: ';
    return `<article class="card ${s}" style="--s:${cor[c.status]}">
      <div class="top"><h3>${esc(c.negocio)}</h3><span class="tag">${esc(c.status)}</span></div>
      <div class="mut">${[c.contato,c.segmento,c.cidade].filter(Boolean).map(esc).join(' • ')||'&nbsp;'}</div>
      ${c.tel?`<div>${esc(c.tel)}</div>`:''}
      ${c.email?`<div class="mut">${esc(c.email)}</div>`:''}
      ${c.web?`<div class="mut">${esc(c.web)}</div>`:''}
      ${c.valor?`<div><b>${brl(c.valor)}</b></div>`:''}
      ${c.retorno?`<div class="ret">${rotulo}${fdata(c.retorno)}</div>`:''}
      ${c.obs?`<div class="obs">${esc(c.obs)}</div>`:''}
      <div class="mut">Cadastrado em ${fdata(c.criado)}</div>
      <div class="acts">
        ${link?`<a class="btn wa" href="${link}" target="_blank" rel="noopener">WhatsApp</a>`:''}
        <button class="btn" data-e="${c.id}">Editar</button>
        <button class="btn danger" data-d="${c.id}">Excluir</button>
      </div>
    </article>`}).join('');
  $('#list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>abrir(b.dataset.e));
  $('#list').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>excluir(b.dataset.d));
}

function abrir(id){
  editId=id||null;
  const f=$('#f'),c=id?clientes.find(x=>x.id===id):{status:'Novo'};
  $('#ft').textContent=id?'Editar cliente':'Novo cliente';
  ['negocio','contato','tel','email','web','segmento','cidade','status','valor','retorno','obs']
    .forEach(k=>f.elements[k].value=c[k]??'');
  $('#dlg').showModal();
  f.elements.negocio.focus();
}

function excluir(id){
  const c=clientes.find(x=>x.id===id);
  if(c&&confirm(`Excluir “${c.negocio}”? Essa ação não pode ser desfeita.`)){
    clientes=clientes.filter(x=>x.id!==id);salvar();render();toast('Cliente excluído');
  }
}

$('#f').addEventListener('submit',e=>{
  const f=e.target,d={};
  ['negocio','contato','tel','email','web','segmento','cidade','status','valor','retorno','obs']
    .forEach(k=>d[k]=f.elements[k].value.trim());
  if(!d.negocio){e.preventDefault();return}
  d.valor=d.valor===''?'':+d.valor;
  if(editId){Object.assign(clientes.find(x=>x.id===editId),d)}
  else clientes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),criado:hoje(),...d});
  salvar();render();toast('Salvo');
});

$('#novo').onclick=()=>abrir();
$('#cancel').onclick=()=>$('#dlg').close();
$('#q').oninput=render;
$('#fs').innerHTML='<option value="">Todos os status</option>'+STATUS.map(([n])=>`<option>${n}</option>`).join('');
$('#fs').onchange=e=>{filtro=e.target.value;render()};
$('#st').innerHTML=STATUS.map(([n])=>`<option>${n}</option>`).join('');

$('#exp').onclick=async()=>{
  try{
    const dl=await claude.use('downloads');
    if(!dl){toast('Exportar não está disponível neste modo.');return}
    await dl.save({filename:'crm-backup-'+hoje()+'.json',data:JSON.stringify(clientes,null,2)});
  }catch(e){if(!e||e.code!=='declined')toast('Não foi possível exportar.')}
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const fl=e.target.files[0];if(!fl)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr))throw 0;
      if(confirm(`Importar ${arr.length} clientes? Isso substitui os dados atuais.`)){clientes=arr;salvar();render();toast('Backup importado')}
    }catch(_){alert('Arquivo inválido.')}
    e.target.value='';
  };
  r.readAsText(fl);
};

carregar();render();
</script>
</body>
</html>
